name: image-smoke

# Build the image and run scripts/smoke.sh against it when anything that goes into it changes:
# the image, or the Rust code built inside it.
on:
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "scripts/smoke.sh"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/image-smoke.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "scripts/smoke.sh"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/image-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: smoke
        run: bash scripts/smoke.sh
