name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  BOX_TOKEN: local-smoke-box-token
  BOX_ALLOW_INSECURE_DEV: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: OpenAPI presence
        run: bash scripts/check-openapi.sh
      - name: CLI docs
        run: bash scripts/check-cli-docs.sh
      - name: native smoke
        run: bash scripts/smoke-native.sh

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: TypeScript typecheck
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund && npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python compiles and imports on its minimum version
        run: |
          python -m compileall -q sdk/python/src
          python -m pip install --quiet ./sdk/python
          python -I -c "import buwiz_computer"
