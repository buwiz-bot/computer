[package]
name = "box-cua"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Computer Use actuators against the box X display"
rust-version.workspace = true
publish = false

[dependencies]
box-common = { workspace = true }
box-desktop = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
x11rb = { workspace = true }
png = { workspace = true }
smallvec = { workspace = true }
arrayvec = { workspace = true }
# Optional so `cargo bench -p box-cua --features mimalloc` matches the guest
# #[global_allocator]. The library does not install an allocator; box-exec does.
mimalloc = { workspace = true, optional = true }

[features]
default = []
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` pauses the clock so the actuator-wait test asserts the shape of
# the timeout without spending ten seconds of wall clock on it.
tokio = { workspace = true, features = ["test-util"] }
criterion = { workspace = true }
bumpalo = { version = "3.16", features = ["collections"] }

[[bench]]
name = "hotpath"
harness = false
