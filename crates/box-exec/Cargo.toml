[package]
name = "box-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Layer 3 exec daemon: shell, files, and workspace jail"
rust-version.workspace = true

[features]
default = ["mimalloc"]
# Process-wide mimalloc (see box-common). Off with --no-default-features if a
# host allocator wins the CUA benches.
mimalloc = ["box-common/mimalloc"]

[dependencies]
box-common = { workspace = true }
box-cua = { workspace = true }
box-desktop = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
serde_json = { workspace = true }
