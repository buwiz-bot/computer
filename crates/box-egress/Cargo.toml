[package]
name = "box-egress"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "box-egress-v1: the wire, the per-computer browsing rules, the address policy and the operator-side client, with no box daemon in it"
rust-version.workspace = true
publish = false

# Kept light on purpose: Buwiz Bot's broker runs this client on the Mac, so it pulls neither
# box-common (axum and the box's daemons' config) nor clap. Plain `ws://` only from here; the
# box's own binary turns on `wss://` through its own tokio-tungstenite features.
[dependencies]
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
