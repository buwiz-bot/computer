services:
  box:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: buwiz-computer:local
    # Hardening is not a kernel sandbox. box-keeper starts as root and starts everything else as a
    # user of its own (docs/USERS.md), which is what these are for. Chromium runs --no-sandbox.
    # These limits reduce blast radius; they do not isolate the guest from the host kernel.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    # Below this a port takes a capability, so a command can't take a service's.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "6906"
    security_opt:
      - no-new-privileges:true
    # A screen with Chromium runs about 180 processes and threads: the box's own and four Bots'
    # come to about 950, and at the limit even an exec cannot start.
    pids_limit: 2048
    mem_limit: 4g
    shm_size: "256mb"
    # Secrets arrive as mounted files, not as environment values. A value in
    # `environment:` lands in pid 1's environ block, which /proc/1/environ
    # serves to every process in the box for the life of the box, and in
    # `docker inspect` on the host. Run `bash scripts/write-secrets.sh` first.
    secrets:
      - box_token
      - box_viewer_password
    environment:
      BOX_TOKEN_FILE: /run/secrets/box_token
      BOX_VIEWER_PASSWORD_FILE: /run/secrets/box_viewer_password
      BOX_ID: ${BOX_ID:-local-dev}
      RUST_LOG: ${RUST_LOG:-info}
      WORKSPACE_ROOT: /workspace
      BOX_DESKTOP: ${BOX_DESKTOP:-1}
      BOX_DESKTOP_REQUIRED: ${BOX_DESKTOP_REQUIRED:-1}
      BOX_DISPLAY: ${BOX_DISPLAY:-:1}
      BOX_DISPLAY_GEOM: ${BOX_DISPLAY_GEOM:-1280x800x24}
      BOX_CHROME: ${BOX_CHROME:-1}
      BOX_CHROME_PROFILE: /home/box/desktops/main/chrome-profile
      BOX_CUA: ${BOX_CUA:-1}
      BOX_EXEC_BIND: 0.0.0.0:1337
      BOX_HOST_BIND: 0.0.0.0:1340
      BOX_MAX_CONCURRENT_EXECS: ${BOX_MAX_CONCURRENT_EXECS:-8}
      # Off by default. See docs/EGRESS.md. Never publish the CONNECT proxy (8791).
      BOX_EGRESS_TUNNEL: ${BOX_EGRESS_TUNNEL:-0}
      BOX_EGRESS_WS_BIND: ${BOX_EGRESS_WS_BIND:-0.0.0.0:8790}
      BOX_EGRESS_PROXY_BIND: ${BOX_EGRESS_PROXY_BIND:-127.0.0.1:8791}
      BOX_EGRESS_ADMIN_BIND: ${BOX_EGRESS_ADMIN_BIND:-127.0.0.1:8792}
      BOX_EGRESS_TUNNEL_BEARER_FILE: ${BOX_EGRESS_TUNNEL_BEARER_FILE:-}
      BOX_EGRESS_RELAY_HOSTS: ${BOX_EGRESS_RELAY_HOSTS:-}
    ports:
      - "127.0.0.1:1337:1337"
      - "127.0.0.1:1340:1340"
      # voxl: 6901 is the box's own screen, 6902-6905 the Bots' own.
      - "127.0.0.1:6901-6905:6901-6905"
      - "127.0.0.1:8790:8790"
    volumes:
      - ./workspace-data:/workspace
      - ./chrome-profile:/home/box/desktops/main/chrome-profile
    # The public health routes, on purpose: a check that sent the token would put it in curl's
    # argv, and in a dumpable process's memory, every few seconds. /v1/ready is for callers.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:1340/v1/health && curl -fsS http://127.0.0.1:1337/v1/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

# This file isn't how the Bot starts a box. Compose mounts these read-only at /run/secrets/<name>, so
# they stay for the life of the box, and Docker Desktop's share doesn't enforce modes: they're
# readable to anything running in the box, an exec child included. This hides them from `docker
# inspect`, not from a command. For that, stage them on a writable mount, as the Bot does:
# box-keeper unlinks what it reads. See README §Auth.
secrets:
  box_token:
    file: ./secrets/box_token
  box_viewer_password:
    file: ./secrets/box_viewer_password
