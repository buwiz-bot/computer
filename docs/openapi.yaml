  /v1/cua/tree:
    post:
      tags: [cua]
      summary: The screen's accessibility tree (AT-SPI), as text
      description: |
        Native apps' buttons, fields, menus and tabs, Chromium's own included, read over that
        screen's accessibility bus. Breadth first, and bounded by node count, depth, time and
        string length: a cut is `truncated`, never an error. Each node's `ref` names it in this
        tree, for POST /v1/cua/element, and `bounds` are in the pixels /v1/cua/click takes. An
        empty tree comes with a `reason`. With no body, the focused window with the defaults.
      security: [{ bearer: [] }]
      parameters:
        - name: display
          in: query
          required: false
          description: Another of the box's screens (`:N`). Without it, the box's own.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeRequest" }
      responses:
        "200":
          description: The tree, possibly cut or empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeResponse" }
        "400":
          description: invalid_request, a limit out of range or a display that isn't `:N`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: a11y_backend, the screen's accessibility registry did not answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: cua_disabled, display_unavailable, or a11y_unavailable when the screen has no accessibility bus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/element:
    post:
      tags: [cua]
      summary: Press, click, focus or fill a node of the screen's latest tree
      security: [{ bearer: [] }]
      parameters:
        - name: display
          in: query
          required: false
          description: The screen whose tree the ref is from (`:N`). Without it, the box's own.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElementRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElementResponse" }
        "400":
          description: invalid_request (a malformed ref, set_text without text), or out_of_range for a click off the screen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: stale_ref, the ref is from an older tree, or its element is gone; read the tree again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: unsupported_action, the element has no way to do it; action_refused, its application said no
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: a11y_backend, the application did not answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: cua_disabled, display_unavailable or a11y_unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

