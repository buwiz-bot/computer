      summary: Return when the screen settles or changes
      description: |
        voxl's /wait, on that screen's voxl, whether or not anyone is watching. With no body,
        returns once nothing has changed for 300 ms. To wait for what an action caused, take
        `seq` before the action and pass it as `since` with `change: true` after.
      security: [{ bearer: [] }]
      parameters:
        - name: display
          in: query
          required: false
          description: Another of the box's screens (`:N`). Without it, the box's own.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitRequest" }
      responses:
        "200":
