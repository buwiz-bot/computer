openapi: 3.1.0
info:
  title: buwiz-computer
  description: |
    Guest HTTP wire for buwiz-computer. Two processes share this document:
    box-exec (port 1337: exec, files, CUA) and box-host (port 1340: identity,
    readiness, desktop/chrome/egress status, screens). Neither service performs model inference.
    Each screen is also served to a browser by voxl on port 6900+N (`:1` is 6901), behind
    voxl's own password; that wire is voxl's, not this document's.
    CUA coordinate space is the X framebuffer 1280x800, origin top-left.
    SDKs connect with caller-supplied exec URL, host URL, and token; they ignore
    /v1/info advertised URLs (those are container-local listen addresses).
    CUA coordinate bounds follow BOX_DISPLAY_GEOM (default 1280x800). Responses
    echo x-request-id. Exec is HTTP-only on the guest; TLS belongs at a reverse
    proxy. The Rust/TS/Python clients speak HTTP or HTTPS.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:1337
    description: box-exec (Compose)
  - url: http://127.0.0.1:1340
    description: box-host (Compose)

tags:
  - name: exec
    description: box-exec — commands and workspace files
  - name: cua
    description: box-exec — Computer Use against DISPLAY=:1 (1280x800)
  - name: browser
    description: box-exec — each screen's Chromium over its DevTools pipe, through ultra-instinct
  - name: host
    description: box-host — identity and readiness
  - name: desktop
    description: box-host — virtual desktop and Chromium status

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      in: header
      name: x-request-id
      required: false
      schema: { type: string, maxLength: 128 }
      description: Optional correlation id. Echoed on the response; minted if omitted.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code: { type: string, examples: [unauthorized, path_escape] }
            message: { type: string }
            status: { type: integer }
            details:
              type: object
              description: |
                What a caller needs to act on this error, for the few that have any. `confirm_required`:
                `{label, confirm}`, the label a person approves and the token sent back as `confirm`.
                `domain_not_allowed`: `{host}`. Absent otherwise.
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, examples: [ok] }
    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          oneOf:
            - type: array
              items: { type: string }
              minItems: 1
            - type: string
              minLength: 1
        cwd: { type: string, description: Relative or absolute path inside the workspace jail }
        bot: { type: string, description: "The Bot this runs for, as its own user. Without it, the shared agent user." }
        timeout_ms: { type: integer, minimum: 1 }
        env:
          type: object
          additionalProperties: { type: string }
        stdin: { type: string, nullable: true }
        detach: { type: boolean, default: false }
        pty: { type: boolean, description: "Not implemented. Returns 400. Use /v1/exec/stream." }
    ExecResponse:
      type: object
      required:
        [stdout, stderr, timed_out, duration_ms, truncated, output_complete, cwd]
      properties:
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer, nullable: true }
        timed_out: { type: boolean }
        duration_ms: { type: integer }
        truncated:
          type: boolean
          description: >-
            The returned output is not everything the command produced: either
            BOX_MAX_OUTPUT_BYTES was hit, or reading stopped before EOF
            (output_complete false). A detached exec that is still running, and
            a stream that failed to start, report output_complete false with
            truncated false: nothing was cut, nothing was read.
        output_complete:
          type: boolean
          description: >-
            Both pipes reached EOF before the response was built. False means a
            process the command left running still holds them, so anything
            written after the foreground exited was not captured. Use
            detach=true or /v1/exec/stream for output that outlives the request.
        cwd: { type: string }
        exec_id: { type: string }
        detached: { type: boolean }
        status: { type: string, nullable: true }
    ExecCancelResponse:
      type: object
      required: [exec_id, cancelled]
      properties:
        exec_id: { type: string }
        cancelled:
          type: boolean
          description: False when the id is known but the exec had already finished.
    ExecStreamEvent:
      type: object
      properties:
        type: { type: string, enum: [stdout, stderr, exit] }
        data: { type: string }
        exec_id: { type: string }
        exit_code: { type: integer, nullable: true }
        timed_out: { type: boolean }
        duration_ms: { type: integer }
        truncated: { type: boolean }
        output_complete: { type: boolean }
        cwd: { type: string }
    FileGet:
      oneOf:
        - type: object
          required: [kind, path, size, encoding, content]
          properties:
            kind: { type: string, enum: [file] }
            path: { type: string }
            size: { type: integer }
            encoding: { type: string, enum: [utf8, base64] }
            content: { type: string }
        - type: object
          required: [kind, path, entries]
          properties:
            kind: { type: string, enum: [directory] }
            path: { type: string }
            entries:
              type: array
              items:
                type: object
                required: [name, kind]
                properties:
                  name: { type: string }
                  kind: { type: string }
                  size: { type: integer, nullable: true }
            truncated: { type: boolean }
    FilePutRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
        encoding: { type: string, enum: [utf8, text, base64], default: utf8 }
        create_dirs: { type: boolean, default: true }
    FilePutResponse:
      type: object
      required: [path, bytes_written]
      properties:
        path: { type: string }
        bytes_written: { type: integer }
    FileDeleteResponse:
      type: object
      required: [path, deleted]
      properties:
        path: { type: string }
        deleted: { type: boolean }
    MkdirRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        parents: { type: boolean, default: true }
    MkdirResponse:
      type: object
      required: [path, created]
      properties:
        path: { type: string }
        created: { type: boolean }
    Ready:
      type: object
      required: [status, service, exec_ready, desktop_ready, viewer_ready]
      properties:
        status: { type: string }
        service: { type: string }
        exec_ready: { type: boolean }
        desktop_ready: { type: boolean }
        viewer_ready:
          type: boolean
          description: The main screen's voxl takes connections. Never holds up ready; the box works unwatched.
    DesktopStatus:
      type: object
      required: [enabled, ready, available, display, geometry, viewer]
      properties:
        enabled: { type: boolean }
        ready: { type: boolean }
        available: { type: boolean, description: Same as ready (compat) }
        display: { type: string }
        geometry: { type: string }
        viewer:
          type: object
          required: [kind, port, path, url]
          properties:
            kind: { type: string, enum: [voxl] }
            port: { type: integer }
            path: { type: string }
            url: { type: string, description: "Never carries the password. Sign in with ?token=<password>." }
    Screen:
      type: object
      required: [display, slot, bot, viewer_port, state, workspace]
      properties:
        display: { type: string, description: ":1 is the box's own; a Bot's own is :2 and up" }
        slot: { type: integer, description: The display's number }
        bot: { type: string, nullable: true, description: The Bot this screen belongs to. Null on the box's own. }
        viewer_port: { type: integer, description: "6900+slot, inside the box. A caller maps it through its own publish." }
        state:
          type: string
          enum: [running, viewer_down, stopped]
          description: |
            running: the display and its voxl are up. viewer_down: the display is up, so input
            and screenshots work, but voxl is not (yet). stopped: no display.
        workspace:
          type: string
          description: |
            This screen's folder, relative to the workspace root: agents/<bot> for a Bot's own,
            shared for the box's own. Recordings, cooks and Chromium downloads land there.
    ScreenList:
      type: object
      required: [screens]
      properties:
        screens:
          type: array
          description: The box's own screen, then each Bot's by slot. Empty with the desktop off.
          items: { $ref: "#/components/schemas/Screen" }
    WaitRequest:
      type: object
      additionalProperties: false
      properties:
        idle: { type: integer, description: "Return once still this many ms (default 300), counted from the request at the earliest" }
        change: { type: boolean, description: Return at the first change instead }
        since: { type: integer, description: Count changes after this seq from an earlier wait }
        region: { type: string, description: "x,y,w,h in desktop pixels; only watch that rectangle" }
        timeout: { type: integer, description: Give up after this many ms (default 10000) }
    WaitResponse:
      type: object
      required: [changed, timed_out, seq, waited_ms]
      properties:
        changed: { type: boolean }
        timed_out: { type: boolean }
        seq: { type: integer, description: Pass as since on a later wait }
        waited_ms: { type: integer }
    RecordStarted:
      type: object
      required: [id]
      properties:
        id: { type: integer }
    RecordStopRequest:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: integer }
    RecordStopResponse:
      type: object
      required: [path, bytes]
      properties:
        path: { type: string, description: "Relative to the workspace, in the screen's folder: <workspace>/recordings/<time>-<id>.mp4" }
        bytes: { type: integer }
    TreeRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [focused_window, desktop]
          default: focused_window
          description: |
            focused_window: the window with the keyboard focus (named by the focused X window's
            title, else AT-SPI's active window) and what's in it. desktop: every application.
        max_depth: { type: integer, minimum: 0, maximum: 40, default: 12, description: Levels below the top nodes }
        max_nodes: { type: integer, minimum: 1, maximum: 2000, default: 400 }
        timeout_ms: { type: integer, minimum: 1, maximum: 10000, default: 3000, description: The walk's budget; what's read by then is returned }
        include_hidden: { type: boolean, default: false, description: Also nodes that are neither showing nor visible, and what's under them }
        compact: { type: boolean, default: true, description: "Nameless containers with nothing to act on (panel, filler, section, …) give their place to their children" }
    A11yBounds:
      type: object
      description: Screen pixels, the space /v1/cua/click takes
      required: [x, y, width, height]
      properties:
        x: { type: integer }
        y: { type: integer }
        width: { type: integer }
        height: { type: integer }
    A11yNode:
      type: object
      required: [ref, role, name, states]
      properties:
        ref: { type: string, examples: ["48213:12"], description: "<tree>:<node>, for POST /v1/cua/element; good for this tree only" }
        role: { type: string, examples: [push_button, entry, frame, page_tab], description: "AT-SPI's role, in snake case" }
        name: { type: string, maxLength: 161, description: May be empty }
        description: { type: string, maxLength: 161 }
        text:
          type: string
          maxLength: 401
          description: A text node's contents when they aren't its name. Never a password field's.
        states:
          type: array
          items:
            type: string
            enum: [active, busy, checkable, checked, collapsed, editable, enabled, expandable, expanded,
              focusable, focused, has_popup, indeterminate, invalid_entry, modal, multi_line, pressed,
              read_only, required, selectable, selected]
        bounds: { $ref: "#/components/schemas/A11yBounds" }
        actions:
          type: array
          maxItems: 8
          items: { type: string }
          description: AT-SPI action names (`click`, `press`, `activate`, …). Unnamed actions (all of Chromium's) aren't listed; `press` runs an unnamed first one.
        children:
          type: array
          items: { $ref: "#/components/schemas/A11yNode" }
        children_omitted: { type: integer, description: Children a limit left out }
    TreeResponse:
      type: object
      required: [snapshot, display, scope, nodes, count, truncated, truncated_by, skipped, elapsed_ms]
      properties:
        snapshot: { type: integer, description: "This tree's number. Only a screen's latest tree can be acted on." }
        display: { type: string }
        scope: { type: string, enum: [focused_window, desktop] }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/A11yNode" }
        count: { type: integer, description: Nodes at every depth }
        truncated: { type: boolean }
        truncated_by:
          type: array
          items: { type: string, enum: [max_nodes, max_depth, time] }
        skipped: { type: integer, description: Nodes whose application failed to answer, left out with what's under them }
        reason: { type: string, description: "Why nodes is empty, when it is: nothing publishes a tree, or no window is focused" }
        elapsed_ms: { type: integer }
    AllowDomains:
      type: array
      maxItems: 64
      items: { type: string, examples: [shop.example, "*.shop.example"] }
      description: |
        The Bot's allowed hosts, sent with each call. Off the list, a page gets no input and isn't
        navigated to. Absent or empty is no restriction.
    BrowserRect:
      type: object
      required: [x, y, width, height]
      description: The page's viewport, in CSS pixels
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
    BrowserElement:
      type: object
      required: [ref, role, label, actions, rect]
      properties:
        ref: { type: string, examples: ["@e5"], description: Good for this snapshot alone }
        role: { type: string, maxLength: 161 }
        label: { type: string, maxLength: 161 }
        actions:
          type: array
          maxItems: 8
          items: { type: string }
        rect: { $ref: "#/components/schemas/BrowserRect" }
        sensitive: { type: boolean, description: "A password field, or one that may be: its text never comes" }
        value: { type: string, maxLength: 401, description: "A field's text, only when its input type is known and isn't password or hidden" }
    BrowserSnapRequest:
      type: object
      additionalProperties: false
      properties:
        max_nodes: { type: integer, minimum: 1, maximum: 1000, default: 200 }
    BrowserSnapResponse:
      type: object
      required: [snapshot, display, url, title, elements, total, truncated, text, elapsed_ms]
      properties:
        snapshot: { type: integer, description: "Its refs are good while this is the current tab's latest snapshot" }
        display: { type: string }
        url: { type: [string, "null"] }
        title: { type: [string, "null"] }
        elements:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/BrowserElement" }
        total: { type: integer, description: Interactive elements on the page }
        truncated: { type: boolean }
        text: { type: string, maxLength: 65540, description: "One line per element: `@eN role \"label\"`" }
        elapsed_ms: { type: integer }
    BrowserActRequest:
      type: object
      additionalProperties: false
      required: [ref, action]
      properties:
        ref: { type: string, examples: ["@e5", "48213:@e5"] }
        snapshot: { type: integer, description: The snapshot the ref is from; anything but the latest is stale_ref }
        action: { type: string, enum: [click, type, select, key, scroll, focus] }
        text: { type: string, maxLength: 65536, description: "type: the text; select: the option; key: the key (Enter, Escape, ArrowDown, …)" }
        confirm: { type: string, description: "click, key, type: the token a confirm_required answer gave, once a person approved its label" }
        allow_domains: { $ref: "#/components/schemas/AllowDomains" }
    BrowserActResponse:
      type: object
      required: [ok, ref, action]
      properties:
        ok: { type: boolean }
        ref: { type: string }
        action: { type: string }
        ticket: { type: integer, description: The guard's one-shot ticket the action ran under }
    BrowserNavigateRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 8192, description: "http, https or about:blank" }
        allow_domains: { $ref: "#/components/schemas/AllowDomains" }
    BrowserTabsRequest:
      type: object
      additionalProperties: false
      required: [op]
      properties:
        op: { type: string, enum: [list, open, close, switch] }
        tab_id: { type: string, maxLength: 128, description: "close, switch" }
        url: { type: string, description: "open (default about:blank)" }
        allow_domains: { $ref: "#/components/schemas/AllowDomains" }
    BrowserTabsResponse:
      type: object
      required: [op]
      properties:
        op: { type: string }
        tabs:
          type: array
          maxItems: 100
          items:
            type: object
            required: [tab_id, url, title]
            properties:
              tab_id: { type: string }
              url: { type: string }
              title: { type: string }
        tab_id: { type: string }
    BrowserWaitRequest:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 1024, description: "The page's visible text contains this (case-insensitive)" }
        url: { type: string, maxLength: 1024, description: The address contains this }
        control: { type: string, maxLength: 1024, description: "A control's label contains this (case-insensitive)" }
        gone: { type: string, maxLength: 1024, description: No control is labelled exactly this }
        load: { type: string, enum: [domcontentloaded, load] }
        timeout_ms: { type: integer, minimum: 1, maximum: 60000, default: 10000 }
    BrowserWaitResponse:
      type: object
      required: [seen, after_ms, url]
      properties:
        seen: { type: boolean }
        after_ms: { type: integer }
        url: { type: [string, "null"] }
    BrowserShotResponse:
      type: object
      required: [format, data, bytes, width, height]
      properties:
        format: { type: string, enum: [png] }
        data: { type: string, description: "The PNG, base64; at most 8 MiB decoded" }
        bytes: { type: integer }
        width: { type: integer }
        height: { type: integer }
    BrowserRunRequest:
      type: object
      additionalProperties: false
      required: [goal]
      properties:
        goal: { type: string, maxLength: 2000 }
        max_steps: { type: integer, minimum: 1, maximum: 50, default: 20 }
        timeout_ms: { type: integer, minimum: 1000, maximum: 300000, default: 120000 }
        allow_domains: { $ref: "#/components/schemas/AllowDomains" }
        confirm: { type: string, description: "The token a blocked run gave, once a person approved its confirm_label" }
    BrowserRunResponse:
      type: object
      required: [outcome, steps, elapsed_ms]
      properties:
        outcome: { type: string, enum: [done, blocked, abstained, failed] }
        reason: { type: string, description: "blocked: why" }
        confirm_label: { type: string, description: "blocked on a confirm: the label a person may approve" }
        confirm: { type: string, description: "blocked on a confirm: the token to send back as confirm" }
        code: { type: string, enum: [needs_confirm, domain_not_allowed], description: "blocked: what stopped it. Absent: the run stopped itself." }
        host: { type: string, description: "blocked on domain_not_allowed: the host off the list, when it could be read" }
        why: { type: string, description: "abstained, failed: why. After an abstain the caller's model may take over." }
        steps:
          type: array
          maxItems: 50
          items:
            type: object
            required: [action, target, effect]
            properties:
              action: { type: string }
              target: { type: string }
              effect: { type: string, examples: [success, no-effect, navigation] }
        elapsed_ms: { type: integer }
    BrowserStateRequest:
      type: object
      additionalProperties: false
      required: [op]
      properties:
        op: { type: string, enum: [save, load] }
        name: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", default: default }
    BrowserStateResponse:
      type: object
      required: [op, name, cookies]
      properties:
        op: { type: string }
        name: { type: string }
        cookies: { type: integer, description: "Counts only: never a value" }
        origins: { type: array, items: { type: string } }
        pending_origins: { type: array, items: { type: string }, description: "load: origins the tab isn't on; navigate there and load again" }
    NavigateResponse:
      type: object
      required: [ok, url]
      properties:
        ok: { type: boolean }
        url: { type: string }
    ElementRequest:
      type: object
      additionalProperties: false
      required: [ref, action]
      properties:
        ref: { type: string, description: A ref from the screen's latest tree }
        action:
          type: string
          enum: [press, click, focus, set_text]
          description: |
            press: the element's own AT-SPI action (click, press, activate, …). The application
            says it took it, not that anything happened: some widgets only act on a real click.
            click: a real click (XTEST) in the middle of the element, where it is now.
            focus: give it the keyboard focus. set_text: replace an editable field's text.
        text: { type: string, maxLength: 65536, description: For set_text alone }
    ElementResponse:
      type: object
      required: [ok, ref, action]
      properties:
        ok: { type: boolean }
        ref: { type: string }
        action: { type: string, enum: [press, click, focus, set_text] }
        performed: { type: string, description: "For press: the AT-SPI action run" }
        at:
          type: object
          description: "For click: where the click went"
          properties:
            x: { type: integer }
            y: { type: integer }
    ChromeStatus:
      type: object
      required: [enabled, ready, running, profile, display]
      properties:
        enabled: { type: boolean }
        ready: { type: boolean, description: The Chromium the entrypoint started is alive. There is no DevTools port. }
        running: { type: boolean }
        profile: { type: string }
        display: { type: string }
    ActiveTab:
      type: object
      required: [url]
      description: >-
        The page in front of Chromium, as the box's extension last reported it. It answers
        "which page is in front", not "prove no one lied": whatever runs as that screen's
        desktop user could write the report.
      properties:
        url:
          type: string
          nullable: true
          description: The front tab's URL; null when nothing has reported.
        atMs: { type: integer, description: When the extension last reported, in ms since the epoch }
        focus:
          type: string
          enum: [password, text, other, none]
          description: The kind of box focused on that page, as the page said. Absent while it has not said.
        seq: { type: integer, description: How many reports this browser has made }
    EgressStatus:
      type: object
      required: [enabled, ready, client_attached, protocol, ws, proxy]
      properties:
        enabled: { type: boolean }
        ready:
          type: boolean
          description: A laptop client is attached; Chromium CONNECT is relayed
        client_attached: { type: boolean }
        protocol: { type: string, examples: [box-egress-v1] }
        ws:
          type: string
          description: Container-local WS listen inventory, not a public connect URL
        proxy:
          type: string
          description: Container-local CONNECT proxy (always loopback; never publish)
    Screenshot:
      type: object
      required: [encoding, mime, width, height, png_base64, bytes]
      properties:
        encoding: { type: string, examples: [base64] }
        mime: { type: string, examples: [image/png] }
        width: { type: integer, examples: [1280] }
        height: { type: integer, examples: [800] }
        bytes: { type: integer }
        png_base64: { type: string }
    ClickRequest:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 1279 }
        y: { type: integer, minimum: 0, maximum: 799 }
        button: { type: integer, minimum: 1, maximum: 7, default: 1 }
    TypeRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
    KeyRequest:
      type: object
      required: [key]
      properties:
        key: { type: string, minLength: 1 }
        action: { type: string, enum: [tap, down, up], default: tap }
    PressRequest:
      type: object
      required: [x, y]
      properties:
        x: { type: integer }
        y: { type: integer }
        button: { type: integer, minimum: 1, maximum: 7, default: 1 }
    ReleaseRequest:
      type: object
      properties:
        x: { type: integer }
        y: { type: integer }
        button: { type: integer, minimum: 1, maximum: 7, default: 1 }
        path:
          type: array
          maxItems: 64
          items:
            type: object
            required: [x, y]
            properties:
              x: { type: integer }
              y: { type: integer }
    Busy:
      type: object
      properties:
        busy: { type: boolean }
        execs:
          type: object
          properties:
            current: { type: integer }
            max: { type: integer }
        shutting_down: { type: boolean }
        exec_ready: { type: boolean }
        desktop_ready: { type: boolean }
        chrome_ready: { type: boolean }
    Metrics:
      type: object
      properties:
        service: { type: string }
        uptime_ms: { type: integer }
        open_fds:
          type: integer
          nullable: true
          description: >-
            Descriptors this process has open, or null where the platform
            cannot report them.
        execs:
          type: object
          properties:
            current: { type: integer }
            max: { type: integer }
            started: { type: integer }
            child_groups:
              type: integer
              description: Child process groups the daemon is currently responsible for.
    WindowList:
      type: object
      required: [display, available, windows]
      properties:
        display: { type: string }
        available: { type: boolean }
        windows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              desktop: { type: integer }
              class: { type: string }
              title: { type: string }
    Shutdown:
      type: object
      required: [ok, service]
      properties:
        ok: { type: boolean }
        service: { type: string }
    RenameRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    RenameResponse:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    ScrollRequest:
      type: object
      required: [x, y, dx, dy]
      properties:
        x: { type: integer }
        y: { type: integer }
        dx: { type: integer }
        dy: { type: integer }
    DragRequest:
      type: object
      required: [x1, y1, x2, y2]
      properties:
        x1: { type: integer, minimum: 0, maximum: 1279 }
        y1: { type: integer, minimum: 0, maximum: 799 }
        x2: { type: integer, minimum: 0, maximum: 1279 }
        y2: { type: integer, minimum: 0, maximum: 799 }
        button: { type: integer, minimum: 1, maximum: 7, default: 1 }
    MoveRequest:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 1279 }
        y: { type: integer, minimum: 0, maximum: 799 }
    CuaOk:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    RecipeRequest:
      type: object
      required: [steps]
      properties:
        name: { type: string }
        stop_on_error: { type: boolean, default: true }
        screenshot: { type: string, enum: [none, end, each], default: end }
        record: { type: boolean, default: false }
        artifact_dir: { type: string }
        settle: { type: string, enum: [off, compressed, raw], default: off }
        observe:
          type: string
          enum: [off, input, page]
          default: off
          description: >-
            What the receipt reports about the desktop the steps ran against.
            off (the default) adds nothing to the receipt and costs nothing.
            input adds the window under each pointer step's target and the
            keyboard focus before each type/key, read over X11 on a connection
            the box already holds. page adds those plus the Chromium page URL
            either side of click, double_click, type and key. Neither changes
            ok, which still means only that no step returned an error.
        steps:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [click, double_click, double-click, move, drag, type, key, scroll, wait, screenshot, press, mousedown, release, mouseup, reset_desktop, reset]
    ObservedWindow:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: >-
            X window id in the same 0x… form wmctrl -lx and
            GET /v1/desktop/windows print, so the two can be matched up.
        class:
          type: string
          description: >-
            WM_CLASS as instance.class. Absent when no window in the ancestry
            claimed a class.
        title:
          type: string
          description: >-
            _NET_WM_NAME, falling back to WM_NAME. For a Chromium window this
            is the page title.
    StepObservation:
      type: object
      required: [observe_ms]
      description: >-
        What the box saw around one step. The block is present only when
        observe asked for it and the step had something to look at; its
        absence means the box did not look. A field missing inside a block
        that is present means the box looked and got no answer — never that
        nothing was there.
      properties:
        target:
          allOf: [{ $ref: "#/components/schemas/ObservedWindow" }]
          description: >-
            The window covering this step's target coordinate, read before the
            step moved anything. A taped click that now lands on a different
            window shows up as a class or title that changed between runs.
        focus:
          type: object
          required: [state]
          description: Where the keys were about to go. Read for type and key only.
          properties:
            state:
              type: string
              enum: [none, pointer_root, root, window]
              description: >-
                none means no window held the focus and the X server would have
                discarded the keystrokes: the type reached nothing at all. root
                means the window manager had parked focus on the root window,
                which on this desktop is also nowhere.
            window: { $ref: "#/components/schemas/ObservedWindow" }
        url_before:
          type: string
          description: >-
            The page Chromium was showing before the step. Absent when no page
            was visible at all, which is not the same as a blank address.
        url_after:
          type: string
          description: >-
            The page once the step and any settle wait returned. Read
            immediately, and a browser navigation is not instant, so a Return
            that did navigate often still shows the old URL here and the new
            one in the next step's url_before. A URL that never moves across a
            whole run is the signal that a Return submitted nothing.
        observe_ms:
          type: integer
          description: >-
            Wall time this step spent looking rather than acting. Not counted
            in the step's ms, the same way a per-step screenshot never was.
    RecipeResponse:
      type: object
      required: [ok, ran, duration_ms, steps]
      properties:
        ok:
          type: boolean
          description: >-
            No step returned an error. Not a claim that anything was achieved:
            a recipe whose taped coordinates have drifted onto another window
            plays every step without error. Read steps[].observed for what the
            box actually saw.
        name: { type: string }
        observe:
          type: string
          enum: [input, page]
          description: >-
            Echoed from the request, and absent when it was off. Without it a
            receipt carrying no observed blocks would be ambiguous: the box
            may have looked and seen nothing, or may never have been asked.
        ran: { type: integer }
        stopped_at: { type: integer, nullable: true }
        duration_ms: { type: integer }
        steps:
          type: array
          items:
            type: object
            required: [index, op, ok, ms]
            properties:
              index: { type: integer }
              op: { type: string }
              ok: { type: boolean }
              ms: { type: integer }
              error: { type: string }
              observed: { $ref: "#/components/schemas/StepObservation" }
        screenshot: { $ref: "#/components/schemas/Screenshot" }
    Info:
      type: object
      required: [box_id, service, protocol, version, capabilities, endpoints, workspace]
      properties:
        box_id: { type: string }
        service: { type: string }
        protocol: { type: string }
        version:
          type: object
          properties:
            box_host: { type: string }
            box_exec: { type: string }
            protocol: { type: string }
        capabilities:
          type: object
          properties:
            exec:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            files:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            desktop:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            viewer:
              type: object
              description: What serves the main screen to a person. Never carries the password.
              required: [kind, port, enabled, ready]
              properties:
                kind: { type: string, enum: [voxl] }
                port: { type: integer }
                enabled: { type: boolean }
                ready: { type: boolean }
            chrome:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            cua:
              type: object
              properties:
                enabled: { type: boolean }
                ready: { type: boolean }
            egress_tunnel:
              type: object
              properties:
                enabled: { type: boolean }
                ready:
                  type: boolean
                  description: A laptop client is attached; CONNECT is relayed.
        endpoints:
          type: object
          properties:
            exec: { type: string }
            host: { type: string }
            scope: { type: string, examples: [container-local] }
        workspace: { type: string }

paths:
  /v1/health:
    get:
      tags: [exec, host]
      summary: Liveness
      description: Public probe. Body is only `{"status":"ok"}` (no service fingerprint).
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/ready:
    get:
      tags: [host]
      summary: Readiness (box-host only)
      description: 200 when box-exec /v1/health succeeds and the X display is up when BOX_DESKTOP_REQUIRED=1. Requires Bearer.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Exec is reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Exec is down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/info:
    get:
      tags: [host]
      summary: Box identity and capabilities (box-host only)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/screen:
    post:
      tags: [exec]
      summary: Start, stop or forget a Bot's screen, open a page in its browser, or list screens
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [up, down, forget, open, list] }
                bot: { type: string }
                url: { type: string, description: "For open: http or https" }
      responses:
        "200":
          description: What box-screen printed, with an error field when it failed
          content:
            application/json:
              schema: { type: object }
        "400": { description: Not a screen request }
        "401": { description: Unauthorized }
        "502": { description: box-keeper didn't answer }
  /v1/exec:
    post:
      tags: [exec]
      summary: Run a command (box-exec only)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: Command finished, timed out, or detached running receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResponse" }
        "400":
          description: Invalid request, PTY requested, or spawn failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: BOX_MAX_CONCURRENT_EXECS slots full
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/exec/{id}:
    get:
      tags: [exec]
      summary: Poll a detached exec (in-memory; not durable)
      security: [{ bearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Detached job snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResponse" }
        "404":
          description: Unknown exec id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [exec]
      summary: Cancel a running exec and its whole process group
      description: >-
        Sends SIGTERM to the exec's process group, then SIGKILL after
        BOX_EXEC_KILL_GRACE_MS. Works for detached execs and for in-flight ones.
      security: [{ bearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Signalled, or the id was known but already finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecCancelResponse" }
        "404":
          description: Unknown exec id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/files:
    get:
      tags: [exec]
      summary: Read a file or list a directory (box-exec only)
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: path
          schema: { type: string }
          description: Workspace-relative or jailed absolute path
        - in: query
          name: encoding
          schema: { type: string, enum: [utf8, text, base64] }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: File or directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileGet" }
        "400":
          description: Path escape or bad encoding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [exec]
      summary: Write a file (box-exec only)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilePutRequest" }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePutResponse" }
        "400":
          description: Path escape or invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: Payload too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [exec]
      summary: Delete a file or directory (box-exec only)
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: recursive
          schema: { type: string, enum: ["true", "1"] }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDeleteResponse" }
        "400":
          description: Path escape, empty path, or non-empty directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/files/mkdir:
    post:
      tags: [exec]
      summary: Create a directory (box-exec only)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MkdirRequest" }
      responses:
        "200":
          description: Created or already present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MkdirResponse" }
        "400":
          description: Path escape or path is a file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/desktop:
    get:
      tags: [desktop, host]
      summary: Virtual desktop status (box-host)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Display probe and voxl viewer URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopStatus" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/screens:
    get:
      tags: [desktop, host]
      summary: Every screen of the box with its display, viewer port and state (box-host)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Screens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreenList" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/chrome:
    get:
      tags: [desktop, host]
      summary: Chromium status (box-host)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Profile path, display, running flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChromeStatus" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/chrome/active-tab:
    get:
      tags: [desktop, host]
      summary: The page in front of Chromium (box-host)
      description: |
        The front tab's URL, as the box's own extension last reported it, on the box's
        own screen or the one named with `display`. `url` is null when nothing has
        reported (no Chromium, or one started without the extension). The report is a
        file in that screen's run folder; a command cannot write it, but anything running
        as that screen's desktop user can, so treat it as a hint of which page is in front.
      security: [{ bearer: [] }]
      parameters:
        - name: display
          in: query
          required: false
          description: Another of the box's screens (`:N`). Without it, the box's own.
          schema: { type: string }
      responses:
        "200":
          description: The page in front, or none known
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveTab" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/egress:
    get:
      tags: [host]
      summary: Egress tunnel status (box-host)
      description: |
        Laptop CONNECT tunnel. enabled follows BOX_EGRESS_TUNNEL. ready /
        client_attached mean a box-egress-tunnel client is attached.
        Fail-closed CONNECT while enabled but not ready. ws/proxy are
        container-local listens, not SDK connect URLs.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Tunnel inventory and client-attached flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressStatus" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/screenshot:
    post:
      tags: [cua]
      summary: Capture the 1280x800 X framebuffer as PNG
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, png] }
      responses:
        "200":
          description: PNG screenshot as JSON metadata or raw image/png
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Screenshot" }
            image/png:
              schema: { type: string, format: binary }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: CUA disabled or display down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/click:
    post:
      tags: [cua]
      summary: Click at framebuffer coordinates
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClickRequest" }
      responses:
        "200":
          description: Clicked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or invalid button
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/double-click:
    post:
      tags: [cua]
      summary: Double-click at framebuffer coordinates
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClickRequest" }
      responses:
        "200":
          description: Double-clicked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or invalid button
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/move:
    post:
      tags: [cua]
      summary: Move the pointer without clicking
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/drag:
    post:
      tags: [cua]
      summary: Drag from one framebuffer point to another
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DragRequest" }
      responses:
        "200":
          description: Dragged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Out of range or invalid button
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/type:
    post:
      tags: [cua]
      summary: Type text into the focused window
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TypeRequest" }
      responses:
        "200":
          description: Typed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Empty or oversized text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/cua/key:
    post:
      tags: [cua]
      summary: Press an xdotool keysym
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyRequest" }
      responses:
        "200":
          description: Key sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuaOk" }
        "400":
          description: Invalid key
          content:
            application/json:
