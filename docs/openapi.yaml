              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: internal, box-exec asked ultra-instinct for a tool it may not use (a bug in box-exec)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: browser_backend, the browser answered badly, too much, or not at all
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: browser_disabled (BOX_BROWSER, BOX_CHROME or BOX_DESKTOP is off), browser_unavailable (the screen has no browser box-exec can use), display_unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "504":
          description: browser_timeout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/browser/state:
    post:
      tags: [browser]
      summary: Save or load this screen's login
      description: |
        Cookies and the tab's storage, in a 0600 file in this screen's own folder of saved logins,
        which only box-exec can read. Counts come back, never values.
      security: [{ bearer: [] }]
      parameters:
        - name: display
          in: query
          required: false
          description: Another of the box's screens (`:N`). Without it, the box's own.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserStateRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserStateResponse" }
        "400":
          description: invalid_request, a field out of range, unknown, or a display that isn't `:N`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: not_found, no Bot holds this screen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: target_gone, the tab is gone; dialog_open, a JavaScript dialog holds the tab
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: busy, more calls wait for this screen's browser than it takes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: internal, box-exec asked ultra-instinct for a tool it may not use (a bug in box-exec)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: browser_backend, the browser answered badly, too much, or not at all
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: browser_disabled (BOX_BROWSER, BOX_CHROME or BOX_DESKTOP is off), browser_unavailable (the screen has no browser box-exec can use), display_unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "504":
          description: browser_timeout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/exec/stream:
    post:
      tags: [exec]
      summary: Stream exec stdout/stderr/exit as NDJSON (or SSE)
      description: |
        Same admission and timeout as POST /v1/exec. Default body is
        application/x-ndjson lines. Send Accept: text/event-stream for SSE.
        PTY is not implemented.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: Stream of stdout/stderr then an exit event
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ExecStreamEvent" }
            text/event-stream:
              schema: { type: string }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Busy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/files/raw:
    get:
      tags: [exec]
      summary: Read a file as application/octet-stream
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Raw bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: Path escape or directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [exec]
      summary: Write a file from an octet-stream body
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: create_dirs
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePutResponse" }

  /v1/files/rename:
    post:
      tags: [exec]
      summary: Rename a file or directory (box-exec only)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenameResponse" }
        "400":
          description: Path escape or destination exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Source not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/busy:
    get:
      tags: [exec, host]
      summary: Exec slots (box-exec) or readiness flags (box-host)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Busy snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Busy" }
        "401":
          description: Missing or wrong token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /v1/shutdown:
    post:
      tags: [exec, host]
      summary: Graceful process shutdown after the response is sent
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Shutdown scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shutdown" }

  /v1/metrics:
    get:
      tags: [exec, host]
      summary: Lightweight process metrics (not Prometheus)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }

  /v1/desktop/windows:
    get:
      tags: [desktop, host]
