[workspace]
resolver = "2"
members = [
    "crates/box-common",
    "crates/box-exec",
    "crates/box-host",
    "crates/box-desktop",
    "crates/box-chrome",
    "crates/box-cua",
    "crates/box-a11y",
    "crates/box-browser",
    "crates/box-egress-tunnel",
    "crates/buwiz-computer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Uriah"]
repository = "https://github.com/buwiz-bot/computer"
rust-version = "1.99"

[workspace.dependencies]
box-common = { path = "crates/box-common" }
box-desktop = { path = "crates/box-desktop" }
box-chrome = { path = "crates/box-chrome" }
box-cua = { path = "crates/box-cua" }
box-a11y = { path = "crates/box-a11y" }
box-browser = { path = "crates/box-browser" }
# ultra-instinct (hexuria/ultra-instinct, MIT): the observe -> gate -> ticket -> execute loop that
# box-browser drives a screen's Chromium through, and its DevTools pipe transport. Pinned to
# 84362cb on ultra-instinct's main (its PR #102, phase 2: the pipe server, snapshot-bound presses,
# stable error codes, run_goal; #104, label folding; #106, the guard on keys and form submits,
# BlockKind, uploads; #114, clicks are real pointer presses by default; #118, an allow-list passes
# only http(s) on a listed host, about:blank and a blob: by its origin; #120, `refuse_blob`, no
# blob: at all under a list; #124, labels drop zero-width characters, and aria-selected /
# aria-current come with `values`; #127, a blocked goal run names a hostless page as the tools do;
# #128, the pipe browser is `CdpBrowser` over a link that also serves `aui open --attach`; #130, a
# scheme-less host:port is named by its host); its docs/embedding.md is the guide. box-browser's
# `seam` is the only place that knows its types; `ultra-instinct-core` is for its
# `normalize_label` alone.
ultra-instinct-mcp = { git = "https://github.com/hexuria/ultra-instinct", rev = "84362cb26c573c005d31de93dedf0d3a218e8afb", default-features = false }
ultra-instinct-guard = { git = "https://github.com/hexuria/ultra-instinct", rev = "84362cb26c573c005d31de93dedf0d3a218e8afb", default-features = false }
ultra-instinct-cdp = { git = "https://github.com/hexuria/ultra-instinct", rev = "84362cb26c573c005d31de93dedf0d3a218e8afb", default-features = false }
ultra-instinct-core = { git = "https://github.com/hexuria/ultra-instinct", rev = "84362cb26c573c005d31de93dedf0d3a218e8afb", default-features = false }
box-egress-tunnel = { path = "crates/box-egress-tunnel" }
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-webpki-roots"] }
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
http = "1"
bytes = "1"
subtle = "2.6"
http-body-util = "0.1"
tempfile = "3"
libc = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
futures-util = "0.3"
tokio-stream = "0.1"
x11rb = { version = "0.13", default-features = true, features = ["xtest", "image"] }
png = "0.17"
smallvec = "1.13"
arrayvec = "0.7"
# Guest daemons (box-exec / box-host). Not bumpalo: general-purpose, thread-local caches.
mimalloc = { version = "0.1.52", default-features = false }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
