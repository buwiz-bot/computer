<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  A screen's accessibility bus (box-a11y-bus): its desktop's apps publish their trees here, and
  box-exec reads them for POST /v1/cua/tree. The bus runs as the screen's desktop user, who may
  always connect. boxsvc (box-exec) is the one other user let in. A command's user is neither,
  and can't reach the socket either: it sits in the screen's run folder, which only the desktop
  and boxsvc may enter. The address comes on the command line (`address`), so nothing listens
  anywhere else. No eavesdropping (`eavesdrop` is never allowed): what box-exec sends an app is between the
  two of them.
-->
<busconfig>
  <type>accessibility</type>
  <auth>EXTERNAL</auth>
  <!-- dbus-daemon wants one, and box-a11y-bus's address replaces it. Should it ever not, this
       one fails to start rather than listen anywhere. -->
  <listen>unix:dir=/nonexistent</listen>
  <policy context="default">
    <allow user="boxsvc"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
</busconfig>
